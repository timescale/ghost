version: '2'
plugins:
  - name: generate
    process:
      cmd: {{.PluginCmd}}
sql:
  - name: postgresql
{{- if .SchemaPath}}
    schema: '{{.SchemaPath}}'
{{- end}}
    database:
      uri: {{.DatabaseURL}}
{{- if not .SchemaPath}}
    analyzer:
      database: only
{{- end}}
    queries: '{{.QueriesPath}}'
    engine: postgresql
    codegen:
      - out: '{{.OutPath}}'
        plugin: generate
        options:
          indent: "  "
          filename: queries.json
